# ── Build memory budget ───────────────────────────────────────────────────────
# Sized for a 16 GB machine that is also running an IDE and a browser. A build has
# TWO long-lived JVMs, and forgetting the second one is the usual cause of swapping:
#
#   1. the Gradle daemon        (org.gradle.jvmargs)
#   2. the Kotlin compile daemon (kotlin.daemon.jvmargs) - a separate process that
#      also runs KSP, and defaults to a heap far larger than this project needs
#
# Raise these on a bigger machine; the numbers are a budget, not a best practice.
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1280m

# Parallel execution runs modules at once, each holding its own worker JVM. From
# lesson 12 this project has several modules, so the cap matters more than the
# parallelism does on a memory-constrained machine.
org.gradle.parallel=true
org.gradle.workers.max=2

org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
